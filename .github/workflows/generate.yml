name: AstroMinute - Generer la video

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON AstroMinute genere par Make (laisser vide pour un test)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOROSCOPE_JSON: ${{ inputs.payload }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Decompresser AstroMinute
        run: |
          mkdir -p app
          unzip -q AstroMinute_AutoGenerator_v2.zip -d app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer FFmpeg et polices
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Installer Python
        working-directory: app
        run: pip install -r requirements.txt

      - name: Preparer les donnees
        working-directory: app
        run: |
          python - <<'PY'
          import json, os, pathlib
          raw = os.environ.get('HOROSCOPE_JSON','').strip()
          target = pathlib.Path('data/input.json')
          if raw:
              obj = json.loads(raw)
              target.write_text(json.dumps(obj, ensure_ascii=False, indent=2), encoding='utf-8')
              print('JSON Make utilise.')
          else:
              target.write_text(pathlib.Path('data/sample.json').read_text(encoding='utf-8'), encoding='utf-8')
              print('Mode test: sample.json utilise.')
          PY

      - name: Generer la video 1080x1920
        working-directory: app
        run: python generator.py --input data/input.json

      - name: Conserver le MP4 comme artefact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: astrominute-video
          path: |
            app/output/*.mp4
            app/output/publish.json
          retention-days: 7

      - name: Upload Cloudinary et retour Make (optionnel)
        working-directory: app
        run: python publish.py
