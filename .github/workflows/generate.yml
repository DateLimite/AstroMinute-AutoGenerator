      - name: Upload Cloudinary et retour Make (optionnel)
        working-directory: app
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          import cloudinary
          import cloudinary.uploader
          import requests

          raw = os.environ.get("CLOUDINARY_URL", "").strip()

          if "cloudinary://" not in raw:
              raise RuntimeError("CLOUDINARY_URL absent ou invalide")

          raw = raw[raw.index("cloudinary://"):]
          parsed = urlparse(raw)

          cloud_name = parsed.hostname or ""
          api_key = unquote(parsed.username or "")
          api_secret = unquote(parsed.password or "")

          if not cloud_name or not api_key or not api_secret:
              raise RuntimeError(
                  "CLOUDINARY_URL ne contient pas cloud_name/api_key/api_secret"
              )

          cloudinary.config(
              cloud_name=cloud_name,
              api_key=api_key,
              api_secret=api_secret,
              secure=True
          )

          root = Path.cwd()

          meta = json.loads(
              (root / "output" / "publish.json").read_text(encoding="utf-8")
          )

          video = Path(meta["video"])
          date = (meta.get("date") or "jour").replace("/", "-")

          result = cloudinary.uploader.upload_large(
              str(video),
              resource_type="video",
              public_id=f"astrominute/{date}",
              overwrite=True
          )

          video_url = result["secure_url"]

          print("Cloudinary upload OK")

          webhook = os.environ.get("MAKE_WEBHOOK_URL", "").strip()

          if webhook:
              payload = {
                  **meta,
                  "video_url": video_url
              }

              response = requests.post(
                  webhook,
                  json=payload,
                  timeout=30
              )

              response.raise_for_status()

              print("Webhook Make envoyé:", response.status_code)
          PY
